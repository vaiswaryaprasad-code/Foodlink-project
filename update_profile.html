
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update NGO Profile | FoodLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f8f5;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #198754;
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-success {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="profile-card">

        <h2>Update NGO Profile</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

       
<form method="POST" action="{% url 'update_profile' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label for="ngo_name" class="form-label">NGO Name</label>
        <input
            type="text"
            id="ngo_name"
            name="ngo_name"
            class="form-control"
            value="{{ profile.ngo_name }}"
            required
        >
    </div>

    <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea
            id="address"
            name="address"
            class="form-control"
            rows="3"
            required
        >{{ profile.address }}</textarea>
    </div>

    <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input
            type="text"
            id="city"
            name="city"
            class="form-control"
            value="{{ profile.city }}"
            required
        >
    </div>

    <button type="submit" class="btn btn-success">
        Save Changes
    </button>
</form>



        <div class="text-center mt-3">
            <a href="{% url 'ngo_dashboard' %}"
               class="btn btn-outline-secondary">
                Back to Dashboard
            </a>
        </div>

    </div>
</div>

</body>
</html>
